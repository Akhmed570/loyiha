
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<style>
body {
  background: #07111f;
  color: #00eaff;
  font-family: Arial;
  text-align: center;
  padding: 20px;
}
h1 { margin-top: 40px; }
#chat {
  background: #102238;
  padding: 15px;
  height: 350px;
  overflow-y: auto;
  border-radius: 15px;
  text-align: left;
  color: white;
}
input {
  width: 68%;
  padding: 13px;
  border-radius: 10px;
  border: none;
}
button {
  padding: 13px;
  background: #00eaff;
  border: none;
  border-radius: 10px;
  font-weight: bold;
}
</style>
</head>
<body>

<h1>🤖 JARVIS AI</h1>
<p>Ahmadalining shaxsiy yordamchisi</p>

<div id="chat">
<p>JARVIS: Salom Ahmadali! Men sizning yordamchingizman.</p>
</div>

<br>
<input id="msg" placeholder="Xabar yozing...">
<button onclick="send()">Yuborish</button>

<script>
function send() {
  let input = document.getElementById("msg");
  let chat = document.getElementById("chat");
  let text = input.value.trim();

  if (!text) return;

  chat.innerHTML += "<p><b>Siz:</b> " + escapeHTML(text) + "</p>";

  let answer = "Hozircha bu savolga javob berishni bilmayman.";

  if (text.toLowerCase().includes("salom")) {
    answer = "Salom Ahmadali! Sizga qanday yordam beray?";
  } else if (text.toLowerCase().includes("isming")) {
    answer = "Men JARVIS, Ahmadalining yordamchisiman.";
  } else if (text.toLowerCase().includes("qalaysan")) {
    answer = "Rahmat, yaxshiman! Siz-chi?";
  }

  chat.innerHTML += "<p><b>JARVIS:</b> " + answer + "</p>";
  chat.scrollTop = chat.scrollHeight;
  input.value = "";
}

function escapeHTML(text) {
  return text.replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);
}
</script>

</body>
</html>
