
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020711">
<title>JARVIS AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #020711;
  color: #eafaff;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  display: flex;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: 650px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 20px;
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0 20px;
  border-bottom: 1px solid #10334a;
}

.logo {
  width: 45px;
  height: 45px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: #071c2c;
  color: #72edff;
  border: 1px solid #176b88;
  font-size: 23px;
  font-weight: bold;
}

h1 {
  font-size: 20px;
  margin: 0;
  letter-spacing: 3px;
}

.status {
  color: #66eaff;
  font-size: 12px;
  margin-top: 5px;
}

.welcome {
  text-align: center;
  margin: 25px 0 0;
}

.welcome h2 {
  font-size: 25px;
  margin-bottom: 8px;
}

.welcome p {
  color: #82b9cb;
  font-size: 14px;
}

/* JARVIS ZARRALI SHARI */

.orb-area {
  height: 380px;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  margin-bottom: 5px;
}

#orb {
  width: min(100%, 400px);
  height: 380px;
  display: block;
}

.orb-label {
  position: absolute;
  bottom: 7px;
  color: #70eaff;
  font-size: 11px;
  letter-spacing: 4px;
}

#chat {
  flex: 1;
  min-height: 130px;
  max-height: 32vh;
  overflow-y: auto;
  padding: 10px 0;
}

.message {
  padding: 13px 16px;
  border-radius: 16px;
  margin: 12px 0;
  line-height: 1.6;
  font-size: 15px;
  overflow-wrap: anywhere;
}

.jarvis {
  background: #071927;
  border: 1px solid #12425a;
  margin-right: 30px;
}

.user {
  background: #10334c;
  margin-left: 30px;
  text-align: right;
}

.controls {
  display: flex;
  gap: 8px;
  padding: 10px;
  background: #07131e;
  border: 1px solid #16445a;
  border-radius: 17px;
}

input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 16px;
  padding: 10px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 12px 15px;
  cursor: pointer;
  font-size: 16px;
}

.send {
  background: #087fa8;
  color: white;
}

.extra {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.extra button {
  flex: 1;
  background: #071927;
  color: #b9edfa;
  border: 1px solid #16445a;
}

button:active {
  opacity: .7;
}

footer {
  text-align: center;
  color: #397087;
  font-size: 12px;
  padding: 18px 0 5px;
}

@media (max-height: 750px) {
  .orb-area {
    height: 290px;
  }

  #orb {
    height: 290px;
  }

  .welcome {
    margin-top: 15px;
  }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="logo">J</div>
  <div>
    <h1>JARVIS</h1>
    <div class="status" id="status">● Tizim tayyor</div>
  </div>
</header>

<div class="welcome">
  <h2>Salom, Ahmadali!</h2>
  <p>Men sizning shaxsiy AI yordamchingizman.</p>
</div>

<div class="orb-area">
  <canvas id="orb"></canvas>
  <div class="orb-label" id="orbLabel">JARVIS ONLINE</div>
</div>

<div id="chat">
  <div class="message jarvis">
    Salom, Ahmadali! Men JARVIS. Sizga qanday yordam beray?
  </div>
</div>

<div class="controls">
  <input id="message"
    placeholder="JARVISga xabar yozing..."
    autocomplete="off">
  <button class="send" onclick="sendMessage()">➤</button>
</div>

<div class="extra">
  <button onclick="listen()">🎙️ Mikrofon</button>
  <button onclick="toggleVoice()" id="voiceButton">
    🔊 Ovoz: ON
  </button>
</div>

<footer>
  JARVIS AI • Ahmadalining yordamchisi
</footer>

</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const statusText = document.getElementById("status");
const orbLabel = document.getElementById("orbLabel");

let voiceEnabled = true;
let orbMode = "idle";
let activity = 0;
let rotation = 0;

const canvas = document.getElementById("orb");
const ctx = canvas.getContext("2d");

let W = 400;
let H = 380;
let particles = [];

function resizeOrb() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  W = rect.width;
  H = rect.height;

  canvas.width = W * dpr;
  canvas.height = H * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function createParticles() {
  particles = [];

  const count = 1800;
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));

  for (let i = 0; i < count; i++) {
    const y = 1 - 2 * (i + 0.5) / count;
    const radius = Math.sqrt(1 - y * y);
    const angle = goldenAngle * i;

    particles.push({
      x: Math.cos(angle) * radius,
      y: y,
      z: Math.sin(angle) * radius,
      seed: Math.random() * Math.PI * 2,
      size: 0.55 + Math.random() * 0.65
    });
  }
}

function setOrbMode(mode) {
  orbMode = mode;

  if (mode === "listening") {
    statusText.textContent = "● Sizni tinglayapman...";
    orbLabel.textContent = "LISTENING";
  } else if (mode === "speaking") {
    statusText.textContent = "● Javob beryapman...";
    orbLabel.textContent = "SPEAKING";
  } else {
    statusText.textContent = "● Tizim tayyor";
    orbLabel.textContent = "JARVIS ONLINE";
  }
}

function animateOrb() {
  requestAnimationFrame(animateOrb);

  const time = performance.now() * 0.001;
  const target = orbMode === "idle" ? 0.13 : 0.9;

  activity += (target - activity) * 0.035;
  rotation += 0.002 + activity * 0.002;

  ctx.clearRect(0, 0, W, H);

  const cx = W / 2;
  const cy = H / 2;
  const base = Math.min(W, H) * 0.43;

  const projected = [];

  for (const p of particles) {
    const wave1 = Math.sin(
      time * 2.8 + p.x * 8 + p.y * 7 + p.seed
    );

    const wave2 = Math.sin(
      time * 1.7 + p.z * 10 + p.seed
    );

    const wave = (
      wave1 * 0.65 + wave2 * 0.35
    ) * activity * 0.055;

    const r = 1 + wave;

    const x = p.x * r;
    const y = p.y * r;
    const z = p.z * r;

    const cos = Math.cos(rotation);
    const sin = Math.sin(rotation);

    const rx = x * cos - z * sin;
    const rz = x * sin + z * cos;

    const tilt = 0.18;
    const ry = y * Math.cos(tilt) - rz * Math.sin(tilt);
    const depth = y * Math.sin(tilt) + rz * Math.cos(tilt);

    const perspective = 1 / (1.55 - depth * 0.28);

    projected.push({
      x: cx + rx * base * perspective,
      y: cy + ry * base * perspective,
      depth: depth,
      size: p.size * (0.85 + (depth + 1) * 0.4)
    });
  }

  // Faqat yorqin havorang nuqtalar
  for (const p of projected) {
    const depthAlpha = 0.55 + (p.depth + 1) * 0.22;
    const pulse = 0.85 + Math.sin(time * 3 + p.x * 0.08) * 0.15;

    ctx.beginPath();

    ctx.fillStyle =
      `rgba(90, 225, 255, ${depthAlpha * pulse})`;

    ctx.shadowColor = "#38dcff";
    ctx.shadowBlur = 7 + activity * 10;

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }

  ctx.shadowBlur = 0;
}

resizeOrb();
createParticles();
animateOrb();

window.addEventListener("resize", resizeOrb);

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function speak(text) {
  if (!voiceEnabled || !window.speechSynthesis) return;

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "uz-UZ";
  speech.rate = 0.95;

  speech.onstart = () => setOrbMode("speaking");
  speech.onend = () => setOrbMode("idle");
  speech.onerror = () => setOrbMode("idle");

  speechSynthesis.speak(speech);
}

function toggleVoice() {
  voiceEnabled = !voiceEnabled;

  document.getElementById("voiceButton").textContent =
    voiceEnabled ? "🔊 Ovoz: ON" : "🔇 Ovoz: OFF";

  if (!voiceEnabled && window.speechSynthesis) {
    speechSynthesis.cancel();
    setOrbMode("idle");
  }
}

function getAnswer(text) {
  const q = text.toLowerCase();

  if (q.includes("salom") || q.includes("assalomu")) {
    return "Va alaykum assalom, Ahmadali! Sizga qanday yordam beray?";
  }

  if (q.includes("isming") || q.includes("kimsan")) {
    return "Men JARVIS, Ahmadalining shaxsiy yordamchisiman.";
  }

  if (q.includes("vaqt") || q.includes("soat")) {
    return "Hozirgi vaqt: " +
      new Date().toLocaleTimeString("uz-UZ");
  }

  if (q.includes("sana") || q.includes("bugun")) {
    return "Bugungi sana: " +
      new Date().toLocaleDateString("uz-UZ");
  }

  if (q.includes("rahmat")) {
    return "Arzimaydi, Ahmadali! Har doim yordam berishga tayyorman.";
  }

  if (q.includes("xayr")) {
    return "Xayr, Ahmadali! Yana uchrashguncha.";
  }

  return "Bu savolga hozircha javob berishni bilmayman. Tez orada menga haqiqiy AI imkoniyatlarini qo‘shamiz.";
}

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  const answer = getAnswer(text);
  addMessage(answer, "jarvis");
  speak(answer);
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") sendMessage();
});

function listen() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    addMessage(
      "Ovozli tanish bu brauzerda mavjud emas. Xabarni yozib yuboring.",
      "jarvis"
    );
    return;
  }

  const recognition = new Recognition();
  recognition.lang = "uz-UZ";
  recognition.interimResults = false;

  setOrbMode("listening");

  recognition.onresult = function(event) {
    input.value = event.results[0][0].transcript;
    setOrbMode("idle");
    sendMessage();
  };

  recognition.onerror = function() {
    setOrbMode("idle");
    addMessage(
      "Mikrofon ishlamadi. Ruxsatlarni tekshiring.",
      "jarvis"
    );
  };

  recognition.onend = function() {
    if (orbMode === "listening") setOrbMode("idle");
  };

  try {
    recognition.start();
  } catch (error) {
    setOrbMode("idle");
    addMessage("Mikrofonni qayta bosib ko‘ring.", "jarvis");
  }
}
</script>
</body>
</html>
