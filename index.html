
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050608">
<title>JARVIS AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #050608;
  color: #f4f4f5;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  display: flex;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: 650px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 20px;
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0 18px;
  border-bottom: 1px solid #202329;
}

.logo {
  width: 45px;
  height: 45px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: #101820;
  color: #54eaff;
  border: 1px solid #24566a;
  font-size: 23px;
  font-weight: bold;
}

h1 {
  font-size: 20px;
  margin: 0;
  letter-spacing: 3px;
}

.status {
  color: #52d9e9;
  font-size: 12px;
  margin-top: 5px;
}

.welcome {
  text-align: center;
  margin: 25px 0 0;
}

.welcome h2 {
  font-size: 25px;
  margin-bottom: 8px;
}

.welcome p {
  color: #9299a3;
  font-size: 14px;
}

/* JARVIS MOVIY ZARRALI SHARI */

.orb-area {
  width: 100%;
  height: 310px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  margin: 0 auto 5px;
}

#orb {
  width: min(100%, 340px);
  height: 310px;
  display: block;
}

.orb-label {
  position: absolute;
  bottom: 9px;
  color: #54dff2;
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  opacity: .8;
}

.orb-area.listening #orb {
  filter: drop-shadow(0 0 13px #00dfff);
}

#chat {
  flex: 1;
  min-height: 150px;
  max-height: 35vh;
  overflow-y: auto;
  padding: 10px 0;
}

.message {
  padding: 13px 16px;
  border-radius: 16px;
  margin: 12px 0;
  line-height: 1.6;
  font-size: 15px;
  overflow-wrap: anywhere;
}

.jarvis {
  background: #101820;
  border: 1px solid #1d3c49;
  margin-right: 30px;
}

.user {
  background: #153447;
  margin-left: 30px;
  text-align: right;
}

.controls {
  display: flex;
  gap: 8px;
  padding: 10px;
  background: #101317;
  border: 1px solid #28333a;
  border-radius: 17px;
}

input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 16px;
  padding: 10px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 12px 15px;
  cursor: pointer;
  font-size: 16px;
}

.send {
  background: #087f9b;
  color: white;
}

.extra {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.extra button {
  flex: 1;
  background: #101820;
  color: #d4d4d8;
  border: 1px solid #29414b;
}

button:active { opacity: .7; }

footer {
  text-align: center;
  color: #626c75;
  font-size: 12px;
  padding: 18px 0 5px;
}

@media (max-height: 750px) {
  .orb-area { height: 250px; }
  #orb { height: 250px; }
  .welcome { margin-top: 15px; }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="logo">J</div>
  <div>
    <h1>JARVIS</h1>
    <div class="status" id="status">● Tizim tayyor</div>
  </div>
</header>

<div class="welcome">
  <h2>Salom, Ahmadali!</h2>
  <p>Men sizning shaxsiy AI yordamchingizman.</p>
</div>

<!-- MOVIY ZARRALI ANIMATSIYA -->
<div class="orb-area" id="orbArea">
  <canvas id="orb"></canvas>
  <div class="orb-label" id="orbLabel">JARVIS ONLINE</div>
</div>

<div id="chat">
  <div class="message jarvis">
    Salom, Ahmadali! Men JARVIS. Sizga qanday yordam beray?
  </div>
</div>

<div class="controls">
  <input id="message"
    placeholder="JARVISga xabar yozing..."
    autocomplete="off">
  <button class="send" onclick="sendMessage()">➤</button>
</div>

<div class="extra">
  <button onclick="listen()">🎙️ Mikrofon</button>
  <button onclick="toggleVoice()" id="voiceButton">
    🔊 Ovoz: ON
  </button>
</div>

<footer>
  JARVIS AI • Ahmadalining yordamchisi
</footer>

</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const statusText = document.getElementById("status");
const orbArea = document.getElementById("orbArea");
const orbLabel = document.getElementById("orbLabel");

let voiceEnabled = true;
let orbMode = "idle";

// ZARRALI SHAR ANIMATSIYASI
const canvas = document.getElementById("orb");
const ctx = canvas.getContext("2d");

let W = 340;
let H = 310;
let rotation = 0;
let activity = 0;
let particles = [];
let connections = [];

function resizeOrb() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  W = rect.width;
  H = rect.height;

  canvas.width = W * dpr;
  canvas.height = H * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function createParticles() {
  particles = [];
  connections = [];

  const count = 430;
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));

  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2;
    const radius = Math.sqrt(1 - y * y);
    const angle = goldenAngle * i;

    particles.push({
      x: Math.cos(angle) * radius,
      y: y,
      z: Math.sin(angle) * radius
    });
  }

  // Yaqin zarralarni chiziqlar bilan bog'lash
  for (let i = 0; i < count; i++) {
    for (let j = i + 1; j < count; j++) {
      const a = particles[i];
      const b = particles[j];

      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const dz = a.z - b.z;

      if (dx*dx + dy*dy + dz*dz < 0.075) {
        connections.push([i, j]);
      }
    }
  }
}

function animateOrb() {
  requestAnimationFrame(animateOrb);

  const time = performance.now() * 0.001;
  const active = orbMode === "idle" ? 0.12 : 0.8;

  activity += (active - activity) * 0.035;
  rotation += orbMode === "idle" ? 0.002 : 0.009;

  ctx.clearRect(0, 0, W, H);

  const cx = W / 2;
  const cy = H / 2;
  const baseRadius = Math.min(W, H) * 0.39;

  const projected = [];

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];

    const wave =
      Math.sin(time * 2.2 + p.x * 8 + p.y * 5) *
      activity * 0.035;

    const r = 1 + wave;

    const x = p.x * r;
    const y = p.y * r;
    const z = p.z * r;

    const cos = Math.cos(rotation);
    const sin = Math.sin(rotation);

    const rx = x * cos - z * sin;
    const rz = x * sin + z * cos;

    const tilt = 0.22;
    const ry = y * Math.cos(tilt) - rz * Math.sin(tilt);
    const depth = y * Math.sin(tilt) + rz * Math.cos(tilt);

    const perspective = 1 / (1.6 - depth * 0.45);

    projected.push({
      x: cx + rx * baseRadius * perspective,
      y: cy + ry * baseRadius * perspective,
      z: depth,
      size: 0.7 + (depth + 1) * 0.7
    });
  }

  // Chiziqlar
  ctx.lineWidth = 0.65;

  for (const pair of connections) {
    const a = projected[pair[0]];
    const b = projected[pair[1]];

    if (a.z < -0.35 && b.z < -0.35) continue;

    const alpha = Math.max(0.04, (a.z + b.z + 2) * 0.13);

    ctx.strokeStyle = `rgba(38, 204, 237, ${alpha})`;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  // Yorqin moviy nuqtalar
  for (const p of projected) {
    const alpha = 0.4 + (p.z + 1) * 0.3;

    ctx.beginPath();
    ctx.fillStyle = `rgba(117, 239, 255, ${alpha})`;
    ctx.shadowBlur = 5 + activity * 7;
    ctx.shadowColor = "#00dfff";
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.shadowBlur = 0;

  // Tashqi xira halqa
  ctx.beginPath();
  ctx.strokeStyle = "rgba(43, 184, 220, 0.12)";
  ctx.lineWidth = 1;
  ctx.arc(cx, cy, baseRadius * 1.17, 0, Math.PI * 2);
  ctx.stroke();
}

function setOrbMode(mode) {
  orbMode = mode;
  orbArea.classList.toggle("listening", mode !== "idle");

  if (mode === "listening") {
    statusText.textContent = "● Sizni tinglayapman...";
    orbLabel.textContent = "LISTENING";
  } else if (mode === "speaking") {
    statusText.textContent = "● Javob beryapman...";
    orbLabel.textContent = "SPEAKING";
  } else {
    statusText.textContent = "● Tizim tayyor";
    orbLabel.textContent = "JARVIS ONLINE";
  }
}

resizeOrb();
createParticles();
animateOrb();
window.addEventListener("resize", resizeOrb);

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function speak(text) {
  if (!voiceEnabled || !window.speechSynthesis) return;

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "uz-UZ";
  speech.rate = 0.95;

  speech.onstart = () => setOrbMode("speaking");
  speech.onend = () => setOrbMode("idle");
  speech.onerror = () => setOrbMode("idle");

  speechSynthesis.speak(speech);
}

function toggleVoice() {
  voiceEnabled = !voiceEnabled;

  document.getElementById("voiceButton").textContent =
    voiceEnabled ? "🔊 Ovoz: ON" : "🔇 Ovoz: OFF";

  if (!voiceEnabled && window.speechSynthesis) {
    speechSynthesis.cancel();
    setOrbMode("idle");
  }
}

function getAnswer(text) {
  const q = text.toLowerCase();

  if (q.includes("salom") || q.includes("assalomu")) {
    return "Va alaykum assalom, Ahmadali! Sizga qanday yordam beray?";
  }

  if (q.includes("isming") || q.includes("kimsan")) {
    return "Men JARVIS, Ahmadalining shaxsiy yordamchisiman.";
  }

  if (q.includes("vaqt") || q.includes("soat")) {
    return "Hozirgi vaqt: " +
      new Date().toLocaleTimeString("uz-UZ");
  }

  if (q.includes("sana") || q.includes("bugun")) {
    return "Bugungi sana: " +
      new Date().toLocaleDateString("uz-UZ");
  }

  if (q.includes("rahmat")) {
    return "Arzimaydi, Ahmadali! Har doim yordam berishga tayyorman.";
  }

  if (q.includes("xayr")) {
    return "Xayr, Ahmadali! Yana uchrashguncha.";
  }

  return "Bu savolga hozircha javob berishni bilmayman. Tez orada menga haqiqiy AI imkoniyatlarini qo‘shamiz.";
}

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  const answer = getAnswer(text);
  addMessage(answer, "jarvis");
  speak(answer);
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") sendMessage();
});

function listen() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    addMessage(
      "Ovozli tanish bu brauzerda mavjud emas. Xabarni yozib yuboring.",
      "jarvis"
    );
    return;
  }

  const recognition = new Recognition();
  recognition.lang = "uz-UZ";
  recognition.interimResults = false;

  setOrbMode("listening");

  recognition.onresult = function(event) {
    input.value = event.results[0][0].transcript;
    setOrbMode("idle");
    sendMessage();
  };

  recognition.onerror = function() {
    setOrbMode("idle");
    addMessage(
      "Mikrofon ishlamadi. Ruxsatlarni tekshiring.",
      "jarvis"
    );
  };

  recognition.onend = function() {
    if (orbMode === "listening") setOrbMode("idle");
  };

  try {
    recognition.start();
  } catch (error) {
    setOrbMode("idle");
    addMessage("Mikrofonni qayta bosib ko‘ring.", "jarvis");
  }
}
</script>
</body>
</html>
